<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src {{endpointOrigin}}; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{docTitle}}</title>
<meta name="description" content="{{subtitle}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#142A3B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v={{cssHash}}">
<script src="assets/app.js?v={{jsHash}}" defer></script>
</head>
<body>
<header class="top">
  <button type="button" id="lang-toggle" class="lang" lang="en">{{langToggle}}</button>
</header>
<main class="wrap">
  <img class="logo" src="assets/logo.svg" alt="{{logoAlt}}" data-i18n-alt="logoAlt" width="150" height="95">

  <section id="join-view" aria-labelledby="join-title">
    <h1 id="join-title" data-i18n="title">{{title}}</h1>
    <p class="sub" data-i18n="subtitle">{{subtitle}}</p>
    <ul class="benefits">
      <li><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="b1">{{b1}}</span></li>
      <li><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="b2">{{b2}}</span></li>
      <li><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="b3">{{b3}}</span></li>
    </ul>

    <form id="join-form" class="card" novalidate>
      <div class="field">
        <label for="phone" data-i18n="phoneLabel">{{phoneLabel}}</label>
        <div class="phone" dir="ltr">
          <div class="cc">
            <span class="cc-value" id="cc-value" aria-hidden="true">+966</span>
            <select id="country" name="country" aria-label="{{countryLabel}}" data-i18n-aria="countryLabel">
              <option value="SA" selected>السعودية +966</option>
            </select>
          </div>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required aria-describedby="phone-error">
        </div>
        <p class="error" id="phone-error" hidden></p>
      </div>

      <div class="field">
        <label for="name" data-i18n="nameLabel">{{nameLabel}}</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="80">
      </div>

      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <div class="field consent">
        <div class="check">
          <input type="checkbox" id="consent" name="consent" required aria-describedby="consent-error">
          <label for="consent" data-i18n="consent">{{consent}}</label>
        </div>
        <p class="error" id="consent-error" hidden></p>
      </div>

      <p class="error form-error" id="form-error" role="alert" hidden></p>

      <button type="submit" class="btn" id="submit"><span class="spinner" aria-hidden="true"></span><span data-i18n="submit">{{submit}}</span></button>
    </form>

    <details class="privacy">
      <summary data-i18n="privacySummary">{{privacySummary}}</summary>
      <p data-i18n="privacyText">{{privacyText}}</p>
    </details>
  </section>

  <section id="done-view" class="done" aria-labelledby="done-title" hidden>
    <div class="done-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 id="done-title" tabindex="-1" data-i18n="doneTitle">{{doneTitle}}</h1>
    <p class="sub" data-i18n="doneText">{{doneText}}</p>
    <a class="btn btn-outline" href="https://linktr.ee/ArmadaR" target="_blank" rel="noopener" data-i18n="follow">{{follow}}</a>
  </section>
</main>
</body>
</html>
